name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: tuxguitar-tabs-organizer

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependencias de Node
        run: npm install

      - name: Compilar app de Tauri
        run: npm run tauri build

      - name: Subir instalador como artifact
        uses: actions/upload-artifact@v4
        with:
          name: tuxguitar-tabs-organizer-windows
          path: |
            tuxguitar-tabs-organizer/src-tauri/target/release/bundle/msi/*.msi
            tuxguitar-tabs-organizer/src-tauri/target/release/bundle/nsis/*.exe
